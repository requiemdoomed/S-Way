<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">S-Way circular logo</title>
  <desc id="logo-description">S-and-quill monogram on warm brown parchment, framed by the bronze and dark brown circular typewriter-key rim from the supplied example. The area outside the circular badge is transparent.</desc>
