    <linearGradient id="star-ink" gradientUnits="userSpaceOnUse" x1="0" y1="54" x2="0" y2="84">
      <stop offset="0" stop-color="#3c2813" />
      <stop offset="0.5" stop-color="#3c2813" />
      <stop offset="1" stop-color="#3c2813" />
    </linearGradient>
    <linearGradient id="lower-s-ink" gradientUnits="userSpaceOnUse" x1="0" y1="138" x2="0" y2="257">
      <stop offset="0" stop-color="#462a14" />
