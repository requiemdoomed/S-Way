      <stop offset="0" stop-color="#f5dcb9" />
      <stop offset="0.65" stop-color="#efd0a8" />
      <stop offset="1" stop-color="#dfb88e" />
    </radialGradient>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="3.5" numOctaves="3" seed="12" stitchTiles="stitch" result="grain" />
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.40 0 0 0 0 0.25 0 0 0 0 0.10 0.18 0 0 0 0" result="brown-grain" />
      <feBlend in="brown-grain" in2="SourceGraphic" mode="normal" />
    </filter>
    <linearGradient id="upper-s-ink" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="146">
      <stop offset="0" stop-color="#382411" />
      <stop offset="0.5" stop-color="#36200f" />
      <stop offset="1" stop-color="#382211" />
