# Hardened nginx configuration for serving S-Way as a static site (used by deployment/Dockerfile).
# Only enable the HSTS line once HTTPS is correctly configured for the production domain.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;                       # no directory listings
    client_max_body_size 1k;             # the site accepts no uploads: documents never reach the server
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_except GET HEAD { deny all; }  # read-only

    types { application/wasm wasm; text/javascript mjs; application/json ipynb; }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), clipboard-read=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log off;                      # nothing about visitors is recorded

    location ~ ^/notebooks/([0-9]{2}_[a-z0-9_]+\.ipynb|index\.json)$ { try_files $uri =404; }
    location ~ ^/(tests|tools|notebooks|deployment|vendor-src)/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri =404; }
}
